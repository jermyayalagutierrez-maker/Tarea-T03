<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - Control 08</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        input[type="number"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; color: white; background: #007bff; }
        button:last-child { background: #6c757d; }
        #mensajeVenta { color: green; font-weight: bold; margin-top: 10px; }
        #totalCajaTexto { color: #333; margin-top: 15px; background: #e9ecef; padding: 10px; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Módulo de Caja Diaria</h2>
        
        <label for="tipoCambioInput">Tipo de Cambio (S/ por \$1 USD):</label>
        <input type="number" id="tipoCambioInput" value="3.75" step="0.01">

        <label for="montoInput">Monto de la Venta (S/):</label>
        <input type="number" id="montoInput" placeholder="Ej. 50.50" step="0.01">

        <div class="btn-group">
            <button onclick="registrarVenta()">Registrar Venta</button>
            <button onclick="calcularTotalCaja()">Calcular Total</button>
        </div>

        <p id="mensajeVenta"></p>
        <h3>Historial de Ventas:</h3>
        <ul id="historialVentas"></ul>
        <h3 id="totalCajaTexto">Total en Caja: S/ 0.00 (\$ 0.00 USD)</h3>
    </div>

    <script>
        let ventasRegistradas = [];
        const _ = id => document.getElementById(id);

        function registrarVenta() {
            const monto = parseFloat(_("montoInput").value);
            const tipoCambio = parseFloat(_("tipoCambioInput").value);

            if (isNaN(monto) || monto <= 0 || isNaN(tipoCambio) || tipoCambio <= 0) {
                alert("Ingrese montos y tipo de cambio válidos mayores a 0.");
                return;
            }

            ventasRegistradas.push(monto);
            _("montoInput").value = "";

            const montoUSD = monto / tipoCambio;
            _("mensajeVenta").innerText = `Venta de S/ ${monto.toFixed(2)} ($ ${montoUSD.toFixed(2)} USD) registrada.`;

            const item = document.createElement("li");
            item.innerText = `Venta: S/ ${monto.toFixed(2)} | Equivalente: $ ${montoUSD.toFixed(2)} USD`;
            _("historialVentas").appendChild(item);
            
            _("montoInput").focus();
        }

        function calcularTotalCaja() {
            const tipoCambio = parseFloat(_("tipoCambioInput").value);
            if (isNaN(tipoCambio) || tipoCambio <= 0) return alert("Tipo de cambio inválido.");

            const totalSoles = ventasRegistradas.reduce((acc, curr) => acc + curr, 0);
            const totalUSD = totalSoles / tipoCambio;

            _("totalCajaTexto").innerText = `Total acumulado en caja: S/ ${totalSoles.toFixed(2)} ($ ${totalUSD.toFixed(2)} USD)`;
        }
    </script>

</body>
</html>
